<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecimiento de Contraseña - DelisHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            max-width: 500px;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .card-body {
            padding: 40px;
        }
        .btn-primary {
            background-color: #4caf50;
            border-radius: 30px;
            padding: 12px;
            font-size: 16px;
        }
        .footer {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }
        .footer a {
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center">Restablecimiento de Contraseña</h3>
                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label for="token" class="form-label">Token</label>
                        <input type="text" class="form-control" id="token" name="token" required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Nueva contraseña</label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Restablecer Contraseña</button>
                </form>
                <div id="responseMessage" class="mt-3"></div>
            </div>
        </div>
        <div class="footer">
            <p>¿Recuperaste tu contraseña? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script>
        document.getElementById("resetPasswordForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const token = document.getElementById("token").value;
            const newPassword = document.getElementById("newPassword").value;

            const resetData = { token, newPassword };

            fetch('http://18.212.68.69:3002/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(resetData)
            })
            .then(response => response.json())
            .then(data => {
                const messageElement = document.getElementById("responseMessage");
                if (data.message === "Password reset successful") {
                    messageElement.innerHTML = `<div class="alert alert-success">Contraseña restablecida con éxito.</div>`;
                    // Redirige al login después de 3 segundos
                    setTimeout(function() {
                        window.location.href = "login.html";
                    }, 3000);  // Redirige después de 3 segundos
                } else {
                    messageElement.innerHTML = `<div class="alert alert-danger">Error: ${data.message}</div>`;
                }
            })
            .catch(error => {
                const messageElement = document.getElementById("responseMessage");
                messageElement.innerHTML = `<div class="alert alert-danger">Error en la solicitud: ${error.message}</div>`;
            });
        });
    </script>
</body>
</html>
