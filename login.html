<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DelisHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            max-width: 500px;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .card-body {
            padding: 40px;
        }
        .btn-primary {
            background-color: #4caf50;
            border-radius: 30px;
            padding: 12px;
            font-size: 16px;
        }
        .footer {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }
        .footer a {
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center">Login en DelisHub</h3>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                </form>
                <div id="responseMessage" class="mt-3"></div>
            </div>
        </div>
        <div class="footer">
            <p>¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
            <p><a href="password-reset.html">He olvidado mi contraseña</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const loginData = {
                email: email,
                password: password
            };

            fetch('http://3.95.178.114:3000/api/login', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(loginData)
            })
            .then(response => response.json())
            .then(data => {
                const messageElement = document.getElementById("responseMessage");
                if (data.message === "Login exitoso") {
                    messageElement.innerHTML = `<div class="alert alert-success">¡Login exitoso!</div>`;
                    // Redirigir al home después de un segundo
                    setTimeout(function() {
                        window.location.href = "home.html";
                    }, 1000);
                } else {
                    messageElement.innerHTML = `<div class="alert alert-danger">Error: ${data.message}</div>`;
                }
            })
            .catch(error => {
                const messageElement = document.getElementById("responseMessage");
                messageElement.innerHTML = `<div class="alert alert-danger">Error en la solicitud: ${error.message}</div>`;
            });
        });
    </script>
</body>
</html>
