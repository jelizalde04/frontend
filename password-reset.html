<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de Contraseña - DelisHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            max-width: 500px;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .card-body {
            padding: 40px;
        }
        .btn-primary {
            background-color: #4caf50;
            border-radius: 30px;
            padding: 12px;
            font-size: 16px;
        }
        .footer {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }
        .footer a {
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center">Recuperación de Contraseña</h3>
                <form id="passwordResetForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Recuperar Contraseña</button>
                </form>
                <div id="responseMessage" class="mt-3"></div>
            </div>
        </div>
        <div class="footer">
            <p>¿Recuperaste tu contraseña? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script>
        document.getElementById("passwordResetForm").addEventListener("submit", function(event) {
            event.preventDefault();  // Evita que el formulario se envíe normalmente

            const email = document.getElementById("email").value;

            const resetData = { email };

            fetch('http://18.212.68.69:3002/api/password-reset', {  // Cambié el puerto para coincidir con el que aparece en la imagen de la herramienta API
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(resetData)
            })
            .then(response => response.json())
            .then(data => {
                const messageElement = document.getElementById("responseMessage");
                // Verifica si el mensaje del servidor es el esperado
                if (data.message === "Password reset email sent") {
                    messageElement.innerHTML = `<div class="alert alert-success">Se ha enviado un correo para restablecer tu contraseña.</div>`;
                    // Redirige después de 5 segundos a la página de reset-password
                    setTimeout(function() {
                        window.location.href = "reset-password.html";
                    }, 5000);  // Redirige después de 5 segundos
                } else {
                    messageElement.innerHTML = `<div class="alert alert-danger">Error: ${data.message}</div>`;
                }
            })
            .catch(error => {
                const messageElement = document.getElementById("responseMessage");
                messageElement.innerHTML = `<div class="alert alert-danger">Error en la solicitud: ${error.message}</div>`;
            });
        });
    </script>
</body>
</html>
